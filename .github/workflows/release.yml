name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prerelease-gate:
    name: Prerelease gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install rust-src (for self-host sysroot)
        run: rustup component add rust-src
      - name: Format
        run: cargo fmt --check
        working-directory: in-cli
      - name: Clippy
        run: cargo clippy --all-targets --features extended --locked -- -D warnings
        working-directory: in-cli
      - name: Test
        run: cargo test --features extended --locked
        working-directory: in-cli
      - name: Check generated protocol models
        run: cargo run --manifest-path in-cli/Cargo.toml --bin protocol-gen && git diff --exit-code -- in-cli/src/hotreload/generated_protocol.rs
      - name: Build in binary (extended)
        run: cargo build --release --bin in --features extended
        working-directory: in-cli
      - name: Add to PATH
        run: echo "$PWD/target/release" >> "$GITHUB_PATH"
        working-directory: in-cli
      - name: Run conformance suite
        # Linux x86_64 JIT backend is incomplete for arrays, floats, classes, and
        # exceptions; do not block the release on these known failures.
        continue-on-error: ${{ runner.os == 'Linux' }}
        run: ./scripts/run-conformance.sh
      - name: Self-host check (experimental)
        continue-on-error: true
        run: in build --path in-cli/src/main.rs --module-id InCli --verbose
      - name: Check diff whitespace
        run: git diff --check

  build:
    needs: prerelease-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
            binary_name: in
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
            binary_name: in
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build in-cli binary
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: in-cli
      - name: Package release tarball
        run: |
          mkdir -p dist
          cp "in-cli/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${{ matrix.binary_name }}"
          tar -czf "dist/in-${{ matrix.asset_suffix }}.tar.gz" -C dist "${{ matrix.binary_name }}"
          shasum -a 256 "dist/in-${{ matrix.asset_suffix }}.tar.gz" > "dist/in-${{ matrix.asset_suffix }}.tar.gz.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_suffix }}
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
