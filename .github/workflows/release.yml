name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease-gate:
    name: Prerelease gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install rust-src (for self-host sysroot)
        run: rustup component add rust-src
      - name: Format
        run: cargo fmt --check
        working-directory: in-cli
      - name: Clippy
        run: cargo clippy --all-targets --features extended --locked -- -D warnings
        working-directory: in-cli
      - name: Test
        run: cargo test --features extended --locked
        working-directory: in-cli
      - name: Check generated protocol models
        run: cargo run --manifest-path in-cli/Cargo.toml --bin protocol-gen && git diff --exit-code -- in-cli/src/hotreload/generated_protocol.rs
      - name: Build in binary (extended)
        run: cargo build --release --bin in --features extended
        working-directory: in-cli
      - name: Add to PATH
        run: echo "$PWD/target/release" >> "$GITHUB_PATH"
        working-directory: in-cli
      - name: Run conformance suite
        run: ./scripts/run-conformance.sh
      - name: Self-host check (experimental)
        timeout-minutes: 5
        continue-on-error: true
        run: |
          IN=./in-cli/target/release/in
          "$IN" build --path in-cli/src/main.rs --module-id InCli --verbose
      - name: Check diff whitespace
        run: git diff --check

  build:
    needs: prerelease-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
            binary_name: in
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
            binary_name: in
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build in-cli binary
        run: cargo build --release --bin in --features extended --locked --target ${{ matrix.target }}
        working-directory: in-cli
      - name: Package release tarball
        run: |
          mkdir -p dist
          cp "in-cli/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${{ matrix.binary_name }}"
          tar -czf "dist/in-${{ matrix.asset_suffix }}.tar.gz" -C dist "${{ matrix.binary_name }}"
          shasum -a 256 "dist/in-${{ matrix.asset_suffix }}.tar.gz" > "dist/in-${{ matrix.asset_suffix }}.tar.gz.sha256"
      - name: Verify packaged compiler
        run: |
          set -euo pipefail
          tarball="dist/in-${{ matrix.asset_suffix }}.tar.gz"
          shasum -a 256 -c "$tarball.sha256"
          test "$(tar -tzf "$tarball")" = "${{ matrix.binary_name }}"
          smoke="$(mktemp -d)"
          trap 'rm -rf "$smoke"' EXIT
          tar -xzf "$tarball" -C "$smoke"
          package="$(cargo pkgid --manifest-path in-cli/Cargo.toml --locked)"
          version="${package##*@}"
          test "$("$smoke/in" --version)" = "in $version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          printf '%s\n' 'fn answer(a: Int, b: Int)->Int{return a*2+b;} fn main()->Int{return answer(17,8);}' > "$smoke/answer.in"
          "$smoke/in" compile --path "$smoke/answer.in" --target native --entry main --out "$smoke/answer" --json
          if "$smoke/answer"; then status=0; else status=$?; fi
          test "$status" -eq 42
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_suffix }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  verify-published:
    name: Verify published compiler (${{ matrix.asset_suffix }})
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_suffix: macos-aarch64
          - os: ubuntu-latest
            asset_suffix: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      ASSET_SUFFIX: ${{ matrix.asset_suffix }}
    steps:
      - name: Download and verify published compiler
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          archive="in-$ASSET_SUFFIX.tar.gz"
          if ! gh release view "$RELEASE_TAG" --json tagName,isDraft,assets |
            jq -e --arg tag "$RELEASE_TAG" --arg archive "$archive" '
              .tagName == $tag and .isDraft == false and
              any(.assets[]; .name == $archive) and
              any(.assets[]; .name == ($archive + ".sha256"))' > /dev/null; then
            echo "::error::Release $RELEASE_TAG is unavailable, mismatched, draft, or missing $archive and its checksum."
            exit 1
          fi
          mkdir "$work/dist"
          gh release download "$RELEASE_TAG" --dir "$work/dist" \
            --pattern "$archive" --pattern "$archive.sha256"
          cd "$work"
          test -s "dist/$archive"
          test -s "dist/$archive.sha256"
          # Published checksum files contain dist/<archive>, not just <archive>.
          shasum -a 256 -c "dist/$archive.sha256"
          test "$(tar -tzf "dist/$archive")" = in
          tar -xzf "dist/$archive"
          test "$(./in --version)" = "in ${RELEASE_TAG#v}"
          printf '%s\n' 'fn answer(a: Int, b: Int)->Int{return a*2+b;} fn main()->Int{return answer(17,8);}' > answer.in
          executable="$(pwd -P)/answer"
          ./in compile --path answer.in --target native --entry main --out "$executable" --json | tee compile.json
          jq -e --arg executable "$executable" '
            .success == true and .artifact_path == $executable and
            .executable_path == $executable' compile.json > /dev/null
          test -x answer
          if ./answer; then status=0; else status=$?; fi
          test "$status" -eq 42
