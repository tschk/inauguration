name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  in-cli:
    name: in-cli (fmt/clippy/test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
        working-directory: in-cli
      - name: Clippy
        run: cargo clippy --all-targets --features extended --locked -- -D warnings
        working-directory: in-cli
      - name: Test
        run: cargo test --features extended --locked
        working-directory: in-cli
      - name: Link and execute native ELF objects
        run: PATH="$PWD/in-cli/target/debug:$PATH" bash scripts/check-native-linkable-objects.sh

  protocol-models:
    name: Protocol models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build protocol-gen
        run: cargo build --bin protocol-gen
        working-directory: in-cli
      - name: Add to PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"
        working-directory: in-cli
      - name: Check generated models
        run: ./scripts/check-protocol-models.sh

  polyglot-samples:
    name: Polyglot samples
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install rust-src
        run: rustup component add rust-src
      - name: Build in binary
        run: cargo build --release --bin in --features extended
        working-directory: in-cli
      - name: Add to PATH
        run: echo "$PWD/in-cli/target/release" >> "$GITHUB_PATH"
      - name: in build (.in sample)
        run: ./scripts/check-in-lang-sample.sh
      - name: in build (.icore sample)
        run: ./scripts/check-icore-sample.sh
      - name: in build (Swift sample)
        run: ./scripts/check-native-subset-sample.sh

  jit-conformance:
    name: JIT conformance
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install rust-src
        run: rustup component add rust-src
      - name: Build in binary
        run: cargo build --release --bin in --features extended
        working-directory: in-cli
      - name: Add to PATH
        run: echo "$PWD/in-cli/target/release" >> "$GITHUB_PATH"
      - name: Run conformance suite
        run: ./scripts/run-conformance.sh
      - name: Compare JIT and native execution
        run: bash scripts/check-backend-differential.sh

  self-host:
    name: Self-host
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install rust-src
        run: rustup component add rust-src
      - name: Build in binary
        run: cargo build --release --bin in --features extended
        working-directory: in-cli
      - name: Add to PATH
        run: echo "$PWD/in-cli/target/release" >> "$GITHUB_PATH"
      - name: Check language matrix exit status
        run: bash scripts/test-self-hosted-language-matrix.sh
      - name: Prevent new known matrix failures
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          baseline=scripts/self-hosted-language-matrix-known-failures.txt
          base="refs/remotes/origin/$BASE_REF"
          git rev-parse --verify "$base"
          if git cat-file -e "$base:$baseline" 2>/dev/null; then
            added=$(comm -13 <(git show "$base:$baseline" | LC_ALL=C sort) <(LC_ALL=C sort "$baseline"))
            if [ -n "$added" ]; then
              printf 'New known matrix failures are not allowed:\n%s\n' "$added" >&2
              exit 1
            fi
          fi
      - name: Run self-hosted language matrix
        env:
          IN_MATRIX_KNOWN_FAILURES: scripts/self-hosted-language-matrix-known-failures.txt
        run: bash scripts/check-self-hosted-language-matrix.sh
      - name: Self-host compile
        run: |
          IN=./in-cli/target/release/in
          "$IN" build --path in-cli/src/main.rs --module-id InCli --verbose
      - name: Check diff whitespace
        run: git diff --check
