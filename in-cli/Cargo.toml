[workspace]
members = []
resolver = "2"

[package]
name = "inauguration"
version = "0.9.6"
edition = "2024"
license = "MPL-2.0"
description = "Rust CLI for the inauguration Swift toolchain experiments: embedded hybrid pipeline (AST refresh → frontend → SIL analysis wave), hotreload daemon (Unix sockets), SwiftPM staging under .build/bin and .build/artifacts, plugins, and workspace-only integration commands (in test)."
repository = "https://github.com/tschk/inauguration"
readme = "README.md"
keywords = ["compiler", "cli", "language", "core-ir"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "inauguration"
path = "src/lib.rs"

[[bin]]
name = "in"
path = "src/main.rs"

[[bin]]
name = "protocol-gen"
path = "src/bin/protocol_gen.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tree-sitter = "0.26.11"
# Tree-sitter parsers (all included by default for polyglot eval/build)
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = "1.1.2"
# Active parsers (extraction logic wired) — always compiled
tree-sitter-lua = "0.5.0"
tree-sitter-perl = "1.1.2"
# HolyC and Ruby have extraction logic, keep as active
tree-sitter-holyc = "0.1.2"
tree-sitter-ruby = "0.23.1"
# LOLCAT — our own grammar (always compiled)
tree-sitter-lolcat = "0.0.1"
# Crystal / Nim — our own grammars (always compiled)
tree-sitter-crystal = "0.1.0"
tree-sitter-nim = "0.1.0"
# Speculative parsers — gated behind parse-extended feature
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-dart = { version = "0.2.0", optional = true }
tree-sitter-elixir = { version = "0.3.5", optional = true }
tree-sitter-erlang = { version = "0.19.0", optional = true }
tree-sitter-fsharp = { version = "0.3.1", optional = true }
tree-sitter-groovy = { version = "0.1.2", optional = true }
tree-sitter-haskell = { version = "0.23.1", optional = true }
tree-sitter-julia = { version = "0.23.1", optional = true }
tree-sitter-kotlin-ng = { version = "1.1.0", optional = true }
tree-sitter-objc = { version = "3.0.2", optional = true }
tree-sitter-ocaml = { version = "0.25.0", optional = true }
tree-sitter-php = { version = "0.24.2", optional = true }
tree-sitter-r = { version = "1.2.0", optional = true }
tree-sitter-scala = { version = "0.26.0", optional = true }
tree-sitter-v = { version = "0.0.3", optional = true }
tar = "0.4.46"
flate2 = "1.1.9"
zip = "8.6.0"
ureq = "3.4.1"
[features]
default = []
parse-extended = [
    "tree-sitter-c-sharp",
    "tree-sitter-dart",
    "tree-sitter-elixir",
    "tree-sitter-erlang",
    "tree-sitter-fsharp",
    "tree-sitter-groovy",
    "tree-sitter-haskell",
    "tree-sitter-julia",
    "tree-sitter-kotlin-ng",
    "tree-sitter-objc",
    "tree-sitter-ocaml",
    "tree-sitter-php",
    "tree-sitter-r",
    "tree-sitter-scala",
    "tree-sitter-v",
]
extended = ["parse-extended"]

[target.'cfg(unix)'.dependencies]
libloading = "0.9"
notify = "8"

[build-dependencies]

[dev-dependencies]
criterion = "0.8"
ureq = "3.4.1"

[[bench]]
name = "hybrid_sil"
harness = false

[profile.release]
lto = true
strip = true
codegen-units = 1

[[bench]]
name = "core_opt"
harness = false

[[bench]]
name = "lower_core_closures"
harness = false

[[bench]]
name = "lower_core"
harness = false
